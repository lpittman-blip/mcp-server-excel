# Squad Autopilot — config validation + Cutline marketplace checks.
# Operator can force-run via workflow_dispatch (force_run=true).

name: Squad Autopilot

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Execute all checks even if board is clear'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: squad-autopilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-config:
    name: Validate Squad + Cutline config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate marketplaces.json
        shell: bash
        run: |
          set -euo pipefail
          FILE=".squad/plugins/marketplaces.json"
          if [ ! -f "$FILE" ]; then
            echo "::error::$FILE missing"
            exit 1
          fi
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('$FILE', 'utf8'));
            if (!Array.isArray(data.marketplaces)) throw new Error('marketplaces array required');
            const cutline = data.marketplaces.find(m => m.name === 'cutline-industries');
            if (!cutline) throw new Error('cutline-industries marketplace not registered');
            if (cutline.source !== 'github/lpittman-g/Cutline-Industries') {
              throw new Error('cutline-industries source must be github/lpittman-g/Cutline-Industries');
            }
            console.log('marketplaces OK:', data.marketplaces.map(m => m.name).join(', '));
          "

      - name: Validate MCP config
        shell: bash
        run: |
          set -euo pipefail
          for FILE in .copilot/mcp-config.json .vscode/mcp.json; do
            if [ -f "$FILE" ]; then
              node -e "JSON.parse(require('fs').readFileSync('$FILE', 'utf8'))"
              echo "$FILE OK"
            fi
          done

      - name: Validate Cutline integration doc
        shell: bash
        run: |
          test -f docs/cutline-integration.md
          grep -q 'lpittman-g/Cutline-Industries' docs/cutline-integration.md
          echo "docs/cutline-integration.md OK"

      - name: Validate Autopilot agent charter
        shell: bash
        run: |
          test -f .squad/agents/autopilot/charter.md
          grep -q 'Cutline Industries' .squad/agents/autopilot/charter.md
          echo "Autopilot charter OK"

  heartbeat:
    name: Ralph heartbeat (optional)
    needs: validate-config
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.force_run == 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Squad board summary
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const teamFile = '.squad/team.md';
            if (!fs.existsSync(teamFile)) {
              core.info('No team.md — skip heartbeat');
              return;
            }
            core.info('Force run — Autopilot validation passed. See validate-config job.');
            const { data: openPRs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 10
            });
            core.info(`Open PRs: ${openPRs.length}`);
